<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; height:100vh; }
    video {
      position:fixed; inset:0;
      width:100%; height:100%;
      object-fit:cover;
    }
  </style>
</head>
<body>
  <video id="v" src="intro.mp4" playsinline autoplay></video>

  <script>
    const v = document.getElementById('v');

    // Try to play with sound; fall back to muted if blocked
    v.muted = false;
    v.play().catch(() => {
      v.muted = true;
      v.play();
    });

    v.addEventListener('ended', () => {
      document.body.style.transition = 'opacity .4s';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = 'profiles.html'; }, 420);
    });
  </script>
</body>
</html>
