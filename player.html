<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background-color: #1a0e06;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(60,30,10,.5) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(40,18,5,.5) 0%, transparent 55%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Stage ── */
    #stage {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* ── Slide: 4 polaroids in a 2×2 grid ── */
    .slide {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(12px, 2.5vw, 28px);
      position: absolute;
      opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
      padding: 20px;
      max-width: min(92vw, 680px);
      width: min(92vw, 680px);
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Single polaroid ── */
    .polaroid {
      background: #faf7f0;
      padding: clamp(8px, 1.5vw, 14px) clamp(8px, 1.5vw, 14px) clamp(28px, 5vw, 46px);
      box-shadow:
        0 3px 6px rgba(0,0,0,.3),
        0 10px 30px rgba(0,0,0,.5);
      transform: rotate(var(--r, 0deg));
      border-radius: 2px;
      position: relative;
    }

    /* ── Pin ── */
    .pin {
      position: absolute;
      top: -13px; left: 50%; transform: translateX(-50%);
      z-index: 5;
      display: flex; flex-direction: column; align-items: center;
    }
    .pin-head {
      width: 16px; height: 16px;
      background: radial-gradient(circle at 35% 30%, #ff8080, #cc0000);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.2);
    }
    .pin-shaft {
      width: 2px; height: 9px;
      background: linear-gradient(to bottom, #aaa, #666);
      border-radius: 0 0 2px 2px;
    }

    /* ── Photo ── */
    .photo-wrap {
      width: 100%; aspect-ratio: 1 / 1;
      overflow: hidden; background: #c8a882;
      position: relative;
    }
    .photo-wrap img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    .photo-ph {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; background: linear-gradient(135deg,#c8a882,#a07850);
    }

    /* ── Polaroid footer ── */
    .pol-foot {
      position: absolute;
      bottom: 6px; left: 0; right: 0;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-size: clamp(.7rem, 1.5vw, .9rem);
      color: #b0907a;
      letter-spacing: 1px;
    }

    /* ── Progress bar ── */
    #progressBar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 3px; background: rgba(255,255,255,.1); z-index: 50;
    }
    #progressFill {
      height: 100%; background: rgba(229,9,20,.7); width: 0%;
      transition: width linear;
    }

    /* ── Slide counter ── */
    #counter {
      position: fixed; top: 24px; right: 36px; z-index: 50;
      color: rgba(255,255,255,.45); font-size: .8rem; letter-spacing: 2px;
    }

    /* ── Back btn ── */
    #backBtn {
      position: fixed; top: 22px; left: 30px; z-index: 50;
      background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2);
      color: rgba(255,255,255,.7); padding: 7px 18px; border-radius: 3px;
      font-size: .82rem; cursor: pointer; backdrop-filter: blur(6px);
    }

    /* ── Sound btn ── */
    #soundBtn {
      position: fixed; bottom: 20px; right: 30px; z-index: 50;
      background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2);
      color: rgba(255,255,255,.6); padding: 7px 16px; border-radius: 3px;
      font-size: .78rem; cursor: pointer; display: none;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }

    body { animation: fadeIn .5s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .fade-out { animation: fadeOut .4s ease forwards !important; }
    @keyframes fadeOut { to{opacity:0} }
  </style>
</head>
<body>

  <div id="stage"></div>

  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="counter"></div>
  <button id="backBtn" onclick="goBack()">← Back</button>
  <button id="soundBtn" onclick="enableMusic()" style="display:none">🎵 Music</button>

  <script>
  (function () {

    const PHOTOS = [
      'images/IMG_0012.jpg','images/IMG_0018.jpg','images/IMG_0037.jpg',
      'images/IMG_0118.jpg','images/IMG_0148.jpg','images/IMG_0170.jpg',
      'images/IMG_0179.jpg','images/IMG_0231.jpg','images/IMG_0234.jpg',
      'images/IMG_0241.jpg','images/IMG_0243.jpg','images/IMG_0244.jpg',
      'images/IMG_0246.jpg','images/IMG_0248.jpg','images/IMG_0250.jpg',
      'images/IMG_0251.jpg','images/IMG_0256.jpg','images/IMG_0259.jpg',
      'images/IMG_0324.jpg','images/IMG_0326.jpg','images/IMG_0332.jpg',
      'images/IMG_0341.jpg','images/IMG_0342.jpg','images/IMG_0343.jpg',
      'images/IMG_0344.jpg','images/IMG_0345.jpg','images/IMG_0346.jpg',
      'images/IMG_0359.jpg','images/IMG_0387.jpg','images/IMG_0388.jpg',
      'images/IMG_0390.jpg','images/IMG_0396.jpg','images/IMG_0397.jpg',
      'images/IMG_0410.jpg','images/IMG_0420.jpg','images/IMG_0424.jpg',
      'images/IMG_0500.jpg','images/IMG_0501.jpg','images/IMG_0502.jpg',
      'images/IMG_0503.jpg','images/IMG_0504.jpg','images/IMG_0505.jpg',
      'images/WA1.jpg','images/WA2.jpg','images/WA3.jpg'
    ];

    const PER_SLIDE = 4;
    const SLIDE_MS  = 1000; // 1 second per slide

    // Group into slides of 4
    const slides = [];
    for (let i = 0; i < PHOTOS.length; i += PER_SLIDE) {
      slides.push(PHOTOS.slice(i, i + PER_SLIDE));
    }

    // Random rotations per photo (stable)
    const rots = PHOTOS.map(() => +(Math.random() * 14 - 7).toFixed(1));

    // ── Build slide DOM ──────────────────────────────
    const stage = document.getElementById('stage');
    slides.forEach((group, si) => {
      const div = document.createElement('div');
      div.className = 'slide';
      div.id = 'slide' + si;

      group.forEach((src, pi) => {
        const photoIdx = si * PER_SLIDE + pi;
        const pol = document.createElement('div');
        pol.className = 'polaroid';
        pol.style.setProperty('--r', rots[photoIdx] + 'deg');
        pol.innerHTML = `
          <div class="pin"><div class="pin-head"></div><div class="pin-shaft"></div></div>
          <div class="photo-wrap">
            <img src="${src}" onerror="this.style.display='none'">
            <div class="photo-ph">📸</div>
          </div>
          <div class="pol-foot">♡</div>`;
        div.appendChild(pol);
      });

      stage.appendChild(div);
    });

    // ── Playback state ───────────────────────────────
    let current = 0;
    let timer   = null;

    function show(idx) {
      document.querySelectorAll('.slide').forEach((s, i) => {
        s.classList.toggle('active', i === idx);
      });
      document.getElementById('counter').textContent =
        `${idx + 1} / ${slides.length}`;

      // Progress bar
      const fill = document.getElementById('progressFill');
      fill.style.transition = 'none';
      fill.style.width = ((idx / slides.length) * 100) + '%';
      // Force reflow then animate to next tick
      fill.getBoundingClientRect();
      fill.style.transition = `width ${SLIDE_MS}ms linear`;
      fill.style.width = (((idx + 1) / slides.length) * 100) + '%';
    }

    function next() {
      if (current < slides.length - 1) {
        current++;
        show(current);
      } else {
        goTo('credits.html');
      }
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(next, SLIDE_MS);
    }

    show(0);
    startTimer();

    // ── Music: Die For You (trimmed from 1:11) ───────
    const music = new Audio('slideshow-music.mp3');
    music.volume = 0.85;
    let musicOn = false;

    function startMusic() {
      if (musicOn) return;
      musicOn = true;
      document.getElementById('soundBtn').style.display = 'none';
      music.currentTime = 0;
      music.play().catch(() => {});
    }

    window.enableMusic = startMusic;

    // Try autoplay immediately (works if user already interacted on a previous page)
    music.play()
      .then(() => { musicOn = true; })
      .catch(() => {
        // Silently start on very first interaction — tap on stage, back btn, anywhere
        document.addEventListener('pointerdown', startMusic, { once: true });
      });

    // ── Navigation ───────────────────────────────────
    function goTo(url) {
      clearInterval(timer);
      music.pause();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = url; }, 420);
    }
    window.goBack = () => goTo('browse.html');

  })();
  </script>
</body>
</html>
