<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }

    video#show {
      width:100vw; height:100vh; object-fit:contain;
      display:block;
    }

    /* Play overlay */
    #overlay {
      position:fixed; inset:0; z-index:10;
      background:rgba(0,0,0,.88);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:28px;
      cursor:pointer;
    }
    #overlay .n {
      font-family:'Bebas Neue',sans-serif;
      font-size:min(30vw,220px);
      color:#E50914; line-height:1;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow:0 0 30px rgba(229,9,20,.4); }
      to   { text-shadow:0 0 90px rgba(229,9,20,.95),0 0 180px rgba(229,9,20,.4); }
    }
    #overlay .play-btn {
      background:#E50914; border:none; color:#fff;
      font-size:1.1rem; font-family:'Bebas Neue',sans-serif;
      letter-spacing:4px; padding:16px 48px; border-radius:4px;
      cursor:pointer;
    }
    #overlay .hint {
      font-size:.72rem; letter-spacing:5px;
      color:rgba(255,255,255,.35); text-transform:uppercase;
    }

    #backBtn {
      position:fixed; top:22px; left:30px; z-index:20;
      background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2);
      color:rgba(255,255,255,.7); padding:7px 18px; border-radius:3px;
      font-size:.82rem; cursor:pointer; display:none;
    }

    body { animation: fadeIn .5s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .fade-out { animation: fadeOut .4s ease forwards !important; }
    @keyframes fadeOut { to{opacity:0} }
  </style>
</head>
<body>

  <video id="show" src="slideshow-video.mp4" playsinline preload="auto"></video>

  <div id="overlay">
    <span class="n">N</span>
    <button class="play-btn" id="playBtn">▶ PLAY</button>
    <span class="hint">our memories</span>
  </div>

  <button id="backBtn" onclick="goBack()">← Back</button>

  <script>
    const vid     = document.getElementById('show');
    const overlay = document.getElementById('overlay');
    const backBtn = document.getElementById('backBtn');

    document.getElementById('playBtn').addEventListener('click', function() {
      overlay.style.transition = 'opacity .3s';
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.display = 'none'; }, 320);
      backBtn.style.display = 'block';
      vid.play();
    });

    vid.addEventListener('ended', function() {
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = 'credits.html'; }, 420);
    });

    function goBack() {
      vid.pause();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = 'browse.html'; }, 420);
    }
  </script>
</body>
</html>
