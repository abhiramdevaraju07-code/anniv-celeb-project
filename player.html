<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400;600&family=Roboto:wght@300;400;700&display=swap">
  <style>
    :root { --red: #E50914; --gray: #808080; --white: #fff; }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #1a0e06;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── START BUTTON (full-screen, acts as tap-to-play) ── */
    #startBtn {
      position: fixed; inset: 0; z-index: 200;
      background: #000;
      border: none; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
    }
    #startBtn .n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: min(30vw, 220px);
      color: var(--red); line-height: 1;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 30px rgba(229,9,20,.4); }
      to   { text-shadow: 0 0 80px rgba(229,9,20,.9), 0 0 160px rgba(229,9,20,.4); }
    }
    #startBtn .hint {
      font-family: 'Roboto', sans-serif;
      font-size: .78rem; letter-spacing: 5px;
      color: rgba(255,255,255,.4); text-transform: uppercase;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.9} }

    /* ── SLIDESHOW ── */
    #stage {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .slide {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(12px,2.5vw,28px);
      position: absolute; opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
      padding: 20px;
      max-width: min(92vw, 680px); width: min(92vw, 680px);
    }
    .slide.active { opacity: 1; pointer-events: auto; }

    .polaroid {
      background: #faf7f0;
      padding: clamp(8px,1.5vw,14px) clamp(8px,1.5vw,14px) clamp(28px,5vw,46px);
      box-shadow: 0 3px 6px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.5);
      transform: rotate(var(--r,0deg));
      border-radius: 2px; position: relative;
    }
    .pin {
      position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: flex; flex-direction: column; align-items: center;
    }
    .pin-head {
      width: 16px; height: 16px;
      background: radial-gradient(circle at 35% 30%, #ff8080, #cc0000);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.2);
    }
    .pin-shaft { width:2px; height:9px; background:linear-gradient(to bottom,#aaa,#666); border-radius:0 0 2px 2px; }
    .photo-wrap { width:100%; aspect-ratio:1/1; overflow:hidden; background:#c8a882; position:relative; }
    .photo-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
    .photo-ph { position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; font-size:2rem; background:linear-gradient(135deg,#c8a882,#a07850); }
    .pol-foot { position:absolute; bottom:6px; left:0; right:0; text-align:center; font-family:'Caveat',cursive; font-size:clamp(.7rem,1.5vw,.9rem); color:#b0907a; letter-spacing:1px; }

    #progressBar { position:fixed; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,.1); z-index:50; }
    #progressFill { height:100%; background:rgba(229,9,20,.7); width:0%; transition:width linear; }
    #counter { position:fixed; top:24px; right:36px; z-index:50; color:rgba(255,255,255,.45); font-size:.8rem; letter-spacing:2px; }
    #backBtn {
      position:fixed; top:22px; left:30px; z-index:50;
      background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.2);
      color:rgba(255,255,255,.7); padding:7px 18px; border-radius:3px;
      font-size:.82rem; cursor:pointer; backdrop-filter:blur(6px);
    }
    #musicBtn {
      position:fixed; bottom:24px; right:24px; z-index:50;
      background:rgba(229,9,20,.85); border:none;
      color:#fff; padding:9px 18px; border-radius:4px;
      font-size:.85rem; cursor:pointer;
      animation:blink 1.4s ease-in-out infinite;
      display:none;
    }
    #volToast {
      position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
      z-index:99; background:rgba(0,0,0,.85);
      color:#fff; padding:10px 22px; border-radius:6px;
      font-size:.9rem; letter-spacing:1px;
      pointer-events:none; opacity:0;
      transition:opacity .4s;
    }

    /* ── CREDITS (inline, same page) ── */
    #creditsScreen {
      display: none;
      position: fixed; inset: 0; z-index: 150;
      background: #000;
    }
    .c-side {
      position: fixed; top: 30px; left: 30px;
      width: 165px; height: 230px;
      border-radius: 4px; overflow: hidden;
      background: #000;
      z-index: 20;
      box-shadow: 0 10px 40px rgba(0,0,0,.8);
      display: flex; align-items: center; justify-content: center;
    }
    .c-side-n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 7rem; color: var(--red); line-height: 1;
      text-shadow: 0 0 30px rgba(229,9,20,.6), 0 0 70px rgba(229,9,20,.3);
    }
    .c-wrap { position: absolute; inset: 0; overflow: hidden; }
    .c-content {
      width: 100%;
      padding: 0 80px 0 225px;
      animation: creditsRoll 55s linear forwards;
    }
    @keyframes creditsRoll {
      from { transform: translateY(100vh); }
      to   { transform: translateY(-100%); }
    }
    .c-gap-top { height: 0; }
    .c-gap-bot { height: 55vh; }
    .c-header { text-align: center; margin-bottom: 70px; }
    .c-badge { font-size:.62rem; letter-spacing:6px; color:var(--red); text-transform:uppercase; margin-bottom:8px; }
    .c-title { font-family:'Roboto',sans-serif; font-size:clamp(1.4rem,3vw,2.4rem); font-weight:900; color:var(--white); margin-bottom:4px; }
    .c-sub { font-size:.82rem; color:var(--gray); letter-spacing:2px; }
    .c-hr { width:55px; height:1px; background:var(--red); margin:28px auto; opacity:.55; }
    .c-row { display:grid; grid-template-columns:260px 1fr; gap:6px; margin-bottom:18px; align-items:start; }
    .c-role { text-align:right; color:var(--gray); font-size:.84rem; padding-right:24px; line-height:1.6; }
    .c-name { color:var(--white); font-size:.84rem; line-height:1.6; }
    .c-name.hi { color:var(--red); font-weight:700; }
    .c-gap { height:40px; }
    .c-end { text-align:center; margin-top:55px; }
    .c-end p { font-family:'Roboto',sans-serif; color:var(--gray); font-size:.9rem; line-height:2.1; font-weight:300; font-style:italic; white-space:pre-line; }
    .c-heart { color:var(--red); font-size:2rem; display:block; margin:24px auto 0; animation:hb 1.6s ease-in-out infinite; }
    @keyframes hb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
    #endButtons {
      display:none; position:fixed; bottom:40px; right:60px;
      flex-direction:row; gap:12px; z-index:30;
    }
    #endButtons button { padding:10px 24px; border-radius:3px; font-size:.9rem; cursor:pointer; }
    #endBtn1 { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4); color:#fff; }
    #endBtn2 { background:var(--red); border:none; color:#fff; font-weight:700; }

    @media (max-width: 768px) {
      .c-content { padding: 0 20px 0 195px; }
      .c-side { width:120px; height:165px; }
      .c-row { grid-template-columns:160px 1fr; }
      .c-role { padding-right:14px; }
    }

    body { animation: fadeIn .5s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .fade-out { animation: fadeOut .4s ease forwards !important; }
    @keyframes fadeOut { to{opacity:0} }
  </style>
</head>
<body>

  <!-- VIDEO used instead of AUDIO — browsers (incl. Brave) block <audio> autoplay
       but allow <video> with user gesture. 2×2 black video track, audio is Die For You. -->
  <video id="bgMusic" src="slideshow-music.mp4" preload="auto"
         playsinline webkit-playsinline muted="false"
         style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"></video>

  <!-- START SCREEN — full-screen button, guaranteed user gesture -->
  <button id="startBtn">
    <span class="n">N</span>
    <span class="hint">tap to play</span>
  </button>

  <!-- SLIDESHOW -->
  <div id="stage"></div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="counter"></div>
  <button id="backBtn" onclick="goBack()">← Back</button>
  <button id="musicBtn" onclick="retryMusic()">🎵 Music</button>
  <div id="volToast">🔊 Turn up your volume!</div>

  <!-- CREDITS (inline, no page navigation) -->
  <div id="creditsScreen">
    <div class="c-side"><span class="c-side-n">N</span></div>
    <div class="c-wrap">
      <div class="c-content" id="creditsContent"></div>
    </div>
    <div id="endButtons">
      <button id="endBtn1" onclick="credNav('index.html')">Watch Again</button>
      <button id="endBtn2" onclick="credNav('browse.html')">Browse ▶</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
  (function () {

    const music = document.getElementById('bgMusic');
    music.volume = 0.85;

    // Auto-retry if audio fails (e.g. network change mid-load)
    let retries = 0;
    function reloadMusic() {
      if (retries++ > 3) {
        document.getElementById('musicBtn').style.display = 'block';
        return;
      }
      music.load();
      music.play().catch(() => {});
    }
    music.addEventListener('error', reloadMusic);
    music.addEventListener('stalled', reloadMusic);

    function showVolToast() {
      const t = document.getElementById('volToast');
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 3000);
    }

    // ── START BUTTON ─────────────────────────────────────────
    document.getElementById('startBtn').addEventListener('click', function() {
      this.style.display = 'none';
      music.muted = false;
      music.play()
        .then(() => {
          document.getElementById('musicBtn').style.display = 'none';
          showVolToast(); // remind user to turn up volume
        })
        .catch((e) => {
          const btn = document.getElementById('musicBtn');
          btn.textContent = '🎵 ' + (e.name || 'tap for music');
          btn.style.display = 'block';
        });
      show(0);
      startTimer();
    });

    window.retryMusic = function() {
      music.play()
        .then(() => { document.getElementById('musicBtn').style.display = 'none'; })
        .catch(() => {});
    };

    // ── PHOTOS ───────────────────────────────────────────────
    const PHOTOS = [
      'images/IMG_0012.jpg','images/IMG_0018.jpg','images/IMG_0037.jpg',
      'images/IMG_0118.jpg','images/IMG_0148.jpg','images/IMG_0170.jpg',
      'images/IMG_0179.jpg','images/IMG_0231.jpg','images/IMG_0234.jpg',
      'images/IMG_0241.jpg','images/IMG_0243.jpg','images/IMG_0244.jpg',
      'images/IMG_0246.jpg','images/IMG_0248.jpg','images/IMG_0250.jpg',
      'images/IMG_0251.jpg','images/IMG_0256.jpg','images/IMG_0259.jpg',
      'images/IMG_0324.jpg','images/IMG_0326.jpg','images/IMG_0332.jpg',
      'images/IMG_0341.jpg','images/IMG_0342.jpg','images/IMG_0343.jpg',
      'images/IMG_0344.jpg','images/IMG_0345.jpg','images/IMG_0346.jpg',
      'images/IMG_0359.jpg','images/IMG_0387.jpg','images/IMG_0388.jpg',
      'images/IMG_0390.jpg','images/IMG_0396.jpg','images/IMG_0397.jpg',
      'images/IMG_0410.jpg','images/IMG_0420.jpg','images/IMG_0424.jpg',
      'images/IMG_0500.jpg','images/IMG_0501.jpg','images/IMG_0502.jpg',
      'images/IMG_0503.jpg','images/IMG_0504.jpg','images/IMG_0505.jpg',
      'images/WA1.jpg','images/WA2.jpg','images/WA3.jpg'
    ];

    const PER_SLIDE = 4;
    const SLIDE_MS  = 1000;

    const slides = [];
    for (let i = 0; i < PHOTOS.length; i += PER_SLIDE) slides.push(PHOTOS.slice(i, i + PER_SLIDE));
    const rots = PHOTOS.map(() => +(Math.random() * 14 - 7).toFixed(1));

    const stage = document.getElementById('stage');
    slides.forEach((group, si) => {
      const div = document.createElement('div');
      div.className = 'slide';
      group.forEach((src, pi) => {
        const photoIdx = si * PER_SLIDE + pi;
        const pol = document.createElement('div');
        pol.className = 'polaroid';
        pol.style.setProperty('--r', rots[photoIdx] + 'deg');
        pol.innerHTML = `
          <div class="pin"><div class="pin-head"></div><div class="pin-shaft"></div></div>
          <div class="photo-wrap">
            <img src="${src}" onerror="this.style.display='none'">
            <div class="photo-ph">📸</div>
          </div>
          <div class="pol-foot">♡</div>`;
        div.appendChild(pol);
      });
      stage.appendChild(div);
    });

    // ── PLAYBACK ─────────────────────────────────────────────
    let current = 0, timer = null;

    function show(idx) {
      document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === idx));
      document.getElementById('counter').textContent = (idx + 1) + ' / ' + slides.length;
      const fill = document.getElementById('progressFill');
      fill.style.transition = 'none';
      fill.style.width = (idx / slides.length * 100) + '%';
      fill.getBoundingClientRect();
      fill.style.transition = 'width ' + SLIDE_MS + 'ms linear';
      fill.style.width = ((idx + 1) / slides.length * 100) + '%';
    }

    function next() {
      if (current < slides.length - 1) { current++; show(current); }
      else showCredits();
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(next, SLIDE_MS);
    }

    // ── CREDITS (inline — music keeps playing) ───────────────
    function row(role, name, hi) {
      return '<div class="c-row"><div class="c-role">' + role + '</div>'
           + '<div class="c-name' + (hi ? ' hi' : '') + '">' + name + '</div></div>';
    }

    function showCredits() {
      clearInterval(timer);
      music.loop = true; // keep looping through credits

      const content = document.getElementById('creditsContent');
      content.innerHTML =
        '<div class="c-gap-top"></div>'
      + '<div class="c-header">'
      +   '<div class="c-badge">A Netflix Original</div>'
      +   '<div class="c-title">Life of ' + CONFIG.yourName + ' &amp; ' + CONFIG.partnerName + '</div>'
      +   '<div class="c-sub">' + CONFIG.anniversary + ' · ' + CONFIG.startDate + '</div>'
      +   '<div class="c-hr"></div>'
      + '</div>'
      + row('Directed by', 'God', true)
      + '<div class="c-gap"></div>'
      + row('Cast', '')
      + row('Boyfriend', CONFIG.yourName, true)
      + row('Girlfriend', CONFIG.partnerName, true)
      + '<div class="c-gap"></div>'
      + row('Written by', 'Fate &amp; Destiny')
      + row('Produced by', 'Patience &amp; Support')
      + row('Director of Photography', 'Our Camera Rolls')
      + row('Location', CONFIG.favoriteLocation)
      + row('Chief Editor', 'Our Favorite Memories')
      + row('Soundtrack', 'Melodies of Us')
      + row('Executive Producers', 'Shared Future Plans')
      + row('Technical Advisor', 'Honest Communication')
      + row('Special Thanks', 'Every little moment')
      + '<div class="c-gap"></div>'
      + '<div class="c-end"><p>' + CONFIG.endMessage.replace(/\n/g, '<br>') + '</p>'
      +   '<span class="c-heart">♥</span></div>'
      + '<div class="c-gap-bot"></div>';

      document.getElementById('creditsScreen').style.display = 'block';

      content.addEventListener('animationend', () => {
        document.getElementById('endButtons').style.display = 'flex';
      });
    }

    // ── NAVIGATION ───────────────────────────────────────────
    window.goBack = function() {
      clearInterval(timer);
      music.pause();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = 'browse.html'; }, 420);
    };

    window.credNav = function(url) {
      music.pause();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = url; }, 450);
    };

  })();
  </script>
</body>
</html>
